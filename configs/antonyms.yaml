# External antonym map — D-032, Cell D-ext.
#
# PURPOSE
# Cell D takes its competing attribute from AMBER itself: for the pair
# (sky, sunny, gloomy) it scores "sunny" against "gloomy" because the dataset
# supplies that contrast. A reviewer can fairly object that the method exploits
# pair structure the baseline has no access to.
#
# Cell D-ext removes that. Each question is answered ON ITS OWN, using a
# competing attribute drawn from THIS FILE, never from the dataset's paired
# negative. No pair structure is used at any point.
#
# CONSTRUCTION RULE — stated so it is auditable
# Each entry is the opposite of the key AS A WORD, decided from its ordinary
# English meaning. The dataset's own negative attribute was NOT consulted for
# any entry. Where an attribute has no defensible opposite, it is OMITTED and
# the question is reported as unmapped — there is deliberately no fallback to
# the dataset's negative, because that would reintroduce exactly the leak this
# cell exists to remove.
#
# Coverage is therefore incomplete by design. The coverage rate is reported
# alongside the accuracy, and unmapped questions are excluded from the scored
# set rather than guessed.
#
# HONESTY NOTE ON COLOURS
# Colours have no true antonyms. The colour entries below use the conventional
# visual contrast (white/black) or the complementary hue (yellow/blue,
# red/green). This is the weakest and most arbitrary part of the map and is
# flagged as such: if D-ext underperforms, colour entries are the first place
# to look, and that is a limitation of the map, not necessarily of the method.
#
# ACTIONS
# Most actions have no opposite (swim, dance, surf, drive). They are omitted
# rather than paired with an invented contrast. Action coverage is expected to
# be much lower than state coverage; that is a reportable property, not a bug.
#
# WRITTEN AND COMMITTED BEFORE ANY D-ext RESULT WAS COMPUTED.

version: 1

antonyms:

  # --- light / weather -----------------------------------------------------
