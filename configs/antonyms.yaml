  black: white
  'pure white': black
  'jet-black': white
  green: brown
  brown: green
  blue: gray
  gray: blue
  azure: gray
  'deep blue': gray
  yellow: blue
  yellowed: green
  yellowing: green
  'yellowing leaves': green
  red: green
