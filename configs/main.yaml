# Main configuration. Values are taken from the TRD; do not vary them per cell.
seed: 20260907
split: dev

# All paths are RELATIVE to the repository root and resolved at runtime.
# No absolute path appears anywhere in this file: the project must run
# unchanged on Windows, Colab and Kaggle.
paths:
  amber: data/amber
  images: data/images
  splits: data/splits/splits.json
  results: results
  results_raw: results/raw
  results_tables: results/tables
  demo_out: results/demo
  # HuggingFace cache. Machine-specific overrides go in the HF_HOME environment
  # variable, never here -- on this Windows host HF_HOME=C:\hf avoids the
  # MAX_PATH failure recorded in D-005 (the repo dir name is 96 chars).
  hf_cache: .hf_cache

# TRD §6 — object localisation
detector:
  model_id: google/owlv2-base-patch16-ensemble
  # Real hash, read from the HF Hub API at first download on 2026-09-07.
  revision: cfd3195ba4ea9592eec887ded089f4c08eff231d
  prompt_template: "a photo of a {phrase}"
  threshold: 0.10        # tune on dev only
  nms_iou: 0.5

crop:
  padding: 0.10          # fraction of box width/height, each side
  min_size: 64           # px

# TRD §7 — attribute verification
attribute:
  model_id: google/siglip-base-patch16-224
  # Real hash, read from the HF Hub API at first download on 2026-09-07.
  revision: 7fd15f0689c79d79e38b1c2e2e2370a7bf2761ed
  # Identical template in all four cells (TRD §7, §16).
  prompt_template: "a photo of a {attr} {obj}"
  confidence_k: 10.0     # sigmoid steepness for threshold cells
  # TRD §7 says "siglip_score" without fixing a scale. SigLIP emits a raw
  # logit; its sigmoid is ~1e-5 here, so tau is swept on the LOGIT scale.
  # See D-011. Changing this changes what tau means.
  score_scale: logit     # logit | sigmoid
  device: cuda           # falls back to cpu automatically if unavailable

existence:
  threshold: null        # fit on dev (TRD §8)

relation:
  tau: null              # fit on dev (TRD §10)

# TRD §11.3
bootstrap:
  n_resamples: 10000
  seed: 20260907
