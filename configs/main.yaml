# Main configuration. Values are taken from the TRD; do not vary them per cell.
seed: 20260907
split: dev

paths:
  amber: data/amber
  images: data/images
  splits: data/splits/splits.json
  results_raw: results/raw
  results_tables: results/tables

# TRD §6 — object localisation
detector:
  model_id: google/owlv2-base-patch16-ensemble
  # M1 MUST pin this to the real revision hash after the first download.
  # Left null deliberately: a hash is never invented (PRD §8 rule 1).
  revision: null
  prompt_template: "a photo of a {phrase}"
  threshold: 0.10        # tune on dev only
  nms_iou: 0.5

crop:
  padding: 0.10          # fraction of box width/height, each side
  min_size: 64           # px

# TRD §7 — attribute verification
attribute:
  model_id: google/siglip-base-patch16-224
  revision: null         # M1 MUST pin. See above.
  # Identical template in all four cells (TRD §7, §16).
  prompt_template: "a photo of a {attr} {obj}"
  confidence_k: 10.0     # sigmoid steepness for threshold cells

existence:
  threshold: null        # fit on dev (TRD §8)

relation:
  tau: null              # fit on dev (TRD §10)

# TRD §11.3
bootstrap:
  n_resamples: 10000
  seed: 20260907
